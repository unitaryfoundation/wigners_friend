[project]
name = "ewfs"
version = "0.1.0"
description = "Extended Wigner's Friend Scenario toolkit."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "vrusso", email = "vincentrusso1@gmail.com" }]
dependencies = [
    "ipykernel>=7.0.1,<8.0.0",
    "jupyter>=1.1.1,<2.0.0",
    "networkx>=3.3,<4.0",
    "notebook==7.4.7",
    "pylatexenc>=2.10,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pytket-qiskit>=0.71.0,<0.73.0",
    "qiskit-aer>=0.17.1,<0.18.0",
    "qiskit-ibm-runtime>=0.43.1,<0.46.0",
    "qiskit>=2.2.2,<3.0.0",
    "qnexus>=0.34.1,<1.0.0",
    "seaborn>=0.13.2,<0.14.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.14.2",
]

[tool.mypy]
files = ["ewfs/**/*.py"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["ewfs"]
