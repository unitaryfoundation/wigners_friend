[tool.poetry]
name = "ewfs"
version = "0.1.0"
description = ""
authors = ["vrusso <vincentrusso1@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.12"
qiskit = "^1.4.0"
pylatexenc = "^2.10"
seaborn = "^0.13.2"
notebook = "7.3.2"
qiskit-aer = "^0.16.1"
jupyter = "^1.1.1"
networkx = "^3.3"
ipykernel = "^6.29.5"
qiskit-ibm-runtime = "^0.35.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
pre-commit = "^4.1.0"
ruff = "^0.9.7"
pytest = "^8.3.4"

[tool.mypy]
files = ["ewfs/**/*.py"]
ignore_missing_imports = true   
follow_imports = "skip"

[tool.ruff]
line-length = 120

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
